# Render blueprint: https://render.com/deploy?repo=https://github.com/MaxMaseratii/Haiti-P2P-USDT-Marketplace
# For launch: change BOTH plans below from free to a paid plan in the Render dashboard
# (web: Starter or higher so it never sleeps; database: Basic or higher, free databases expire).
# Values marked sync:false are set in the Render dashboard (Environment). Render keeps them.
services:
  - type: web
    name: haiti-p2p
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        sync: false            # test mode: haiti-p2p-db. Real money: a NEW empty database (the app refuses a test-mode one)
      - key: TOKEN_SECRET
        generateValue: true
      - key: PGSSL
        value: "false"
      # ---- real money ----
      - key: ESCROW_MODE
        sync: false            # EVM (real contract). Use the lines from /owner.html
      - key: SMS_PROVIDER
        sync: false            # email (Brevo codes, free) or twilio (SMS)
      - key: ADMIN_PHONES
        sync: false            # YOUR phone, like +50937001234. You become admin when you sign up
      - key: ADMIN_LOGIN_CODE
        sync: false            # only used on a laptop in test mode. Not needed live
      # ---- real money on Arbitrum (copy from /owner.html after you deploy) ----
      - key: ESCROW_NETWORK
        sync: false
      - key: EVM_RPC_URL
        sync: false            # best: your Alchemy Arbitrum URL
      - key: EVM_CHAIN_ID
        sync: false
      - key: EVM_ESCROW_ADDRESS
        sync: false
      - key: EVM_START_BLOCK
        sync: false
      - key: EVM_CONFIRMATIONS
        sync: false
      - key: TOKEN_USDT
        sync: false
      - key: TOKEN_USDC
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false            # the app wallet secret key. Never share it.
      - key: WITHDRAW_FEE_USDT
        sync: false            # flat fee the person withdrawing pays (covers the network cost). Default 1
      - key: LOCK_FEE_USDT
        sync: false            # flat fee the buyer pays per order (covers lock and unlock network cost). Default 0.25
      # ---- login codes by email (SMS_PROVIDER=email) ----
      - key: BREVO_API_KEY
        sync: false            # Brevo -> SMTP & API -> API keys
      - key: MAIL_FROM
        sync: false            # a sender email verified in Brevo
      # ---- real SMS (Twilio) ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false            # a Twilio phone number, or leave empty and set TWILIO_MESSAGING_SERVICE_SID
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
databases:
  - name: haiti-p2p-db
    plan: free
